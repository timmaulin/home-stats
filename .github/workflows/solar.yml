name: Solar forecast

on:
  schedule:
    - cron: "2 21 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python solar.py
        env:
          SOLCAST_API_KEY: ${{ secrets.SOLCAST_API_KEY }}
      - name: Update energy usage
        env:
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ACCOUNT_NUMBER: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}
          GAS_CALORIFIC_VALUE_MJ_M3: ${{ vars.GAS_CALORIFIC_VALUE_MJ_M3 || '39.0' }}
        run: |
          if [ -n "$OCTOPUS_API_KEY" ] && [ -n "$OCTOPUS_ACCOUNT_NUMBER" ]; then
            python usage.py
          else
            echo "::notice::Usage page skipped: add OCTOPUS_API_KEY and OCTOPUS_ACCOUNT_NUMBER secrets."
          fi
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Update forecast"
          git push
