<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar forecast</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
 body{font-family:system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px;background:#fafafa;color:#222}
 select{font-size:1rem;padding:6px;margin-bottom:12px}
 .cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
 .card{flex:1 1 260px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}
 .big{font-size:1.4rem;font-weight:600}
 table{border-collapse:collapse;width:100%;background:#fff}
 th,td{padding:6px 10px;border-bottom:1px solid #eee;text-align:right}
 th:first-child,td:first-child{text-align:left}
 small{color:#666}
</style></head><body>
<h1>Solar forecast</h1>
<small id="upd"></small><br>
<select id="day"></select>
<div class="big" id="tot"></div>
<canvas id="chart" height="110"></canvas>
<h2>Battery (<span id="bat"></span>)</h2>
<div class="cards" id="cards"></div>
<h2>Hourly watts</h2>
<table id="tbl"></table>
<script>
const D = {"updated": "Thu 19 Nov 2026 22:13", "battery_wh": 3000, "window": "08:00-13:00", "panels": ["Panel 1", "Panel 2"], "days": [{"date": "2026-11-20", "label": "Fri 20 Nov", "hours": [{"hour": "07:00", "Panel 1": 0, "Panel 2": 1, "total": 1}, {"hour": "08:00", "Panel 1": 6, "Panel 2": 25, "total": 31}, {"hour": "09:00", "Panel 1": 80, "Panel 2": 177, "total": 257}, {"hour": "10:00", "Panel 1": 193, "Panel 2": 401, "total": 594}, {"hour": "11:00", "Panel 1": 248, "Panel 2": 520, "total": 768}, {"hour": "12:00", "Panel 1": 277, "Panel 2": 577, "total": 854}, {"hour": "13:00", "Panel 1": 277, "Panel 2": 564, "total": 842}, {"hour": "14:00", "Panel 1": 232, "Panel 2": 455, "total": 687}, {"hour": "15:00", "Panel 1": 91, "Panel 2": 170, "total": 261}], "total_kwh": 4.29, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 100}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 54}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": false, "hours": 5, "remaining_pct": 26}, "cloudy": {"empty": true, "hours": 3.1, "empty_at": "11:06"}}]}, {"date": "2026-11-21", "label": "Sat 21 Nov", "hours": [{"hour": "07:00", "Panel 1": 1, "Panel 2": 1, "total": 2}, {"hour": "08:00", "Panel 1": 65, "Panel 2": 98, "total": 163}, {"hour": "09:00", "Panel 1": 160, "Panel 2": 304, "total": 465}, {"hour": "10:00", "Panel 1": 231, "Panel 2": 468, "total": 699}, {"hour": "11:00", "Panel 1": 276, "Panel 2": 573, "total": 849}, {"hour": "12:00", "Panel 1": 301, "Panel 2": 621, "total": 922}, {"hour": "13:00", "Panel 1": 284, "Panel 2": 575, "total": 859}, {"hour": "14:00", "Panel 1": 225, "Panel 2": 440, "total": 665}, {"hour": "15:00", "Panel 1": 83, "Panel 2": 154, "total": 237}], "total_kwh": 4.86, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 100}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 69}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": false, "hours": 5, "remaining_pct": 48}, "cloudy": {"empty": true, "hours": 3.4, "empty_at": "11:23"}}]}, {"date": "2026-11-22", "label": "Sun 22 Nov", "hours": [{"hour": "08:00", "Panel 1": 4, "Panel 2": 19, "total": 23}, {"hour": "09:00", "Panel 1": 9, "Panel 2": 57, "total": 67}, {"hour": "10:00", "Panel 1": 19, "Panel 2": 95, "total": 114}, {"hour": "11:00", "Panel 1": 29, "Panel 2": 119, "total": 148}, {"hour": "12:00", "Panel 1": 33, "Panel 2": 126, "total": 160}, {"hour": "13:00", "Panel 1": 27, "Panel 2": 105, "total": 133}, {"hour": "14:00", "Panel 1": 11, "Panel 2": 52, "total": 62}, {"hour": "15:00", "Panel 1": 2, "Panel 2": 11, "total": 13}], "total_kwh": 0.72, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 63}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 48}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": true, "hours": 3.27, "empty_at": "11:16"}, "cloudy": {"empty": true, "hours": 3.06, "empty_at": "11:03"}}]}]};
const sel = document.getElementById('day');
document.getElementById('upd').textContent = 'Updated ' + D.updated;
document.getElementById('bat').textContent =
  (D.battery_wh/1000) + ' kWh, on at ' + D.window.replace('-', ', off at ');
D.days.forEach((d,i)=>sel.add(new Option(d.label,i)));
let chart;
function fmt(r){
  if(r.empty){
    const h=Math.floor(r.hours), m=Math.round((r.hours-h)*60);
    return 'Empty at '+r.empty_at+' ('+h+'h '+m+'m)';
  }
  return 'Lasts to '+D.window.split('-')[1]+', '+r.remaining_pct+'% left';
}
function render(i){
  const d=D.days[i];
  document.getElementById('tot').textContent = d.total_kwh+' kWh expected';
  const labels=d.hours.map(h=>h.hour);
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('chart'),{type:'bar',
    data:{labels,datasets:D.panels.map(p=>({label:p,data:d.hours.map(h=>h[p])}))},
    options:{scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'Watts'}}}}});
  document.getElementById('cards').innerHTML = d.battery ? d.battery.map(b=>
    '<div class="card"><b>'+b.name+' ('+b.load_w+' W)</b><div class="big">'+fmt(b.expected)+
    '</div><small>Cloudy case (P10): '+fmt(b.cloudy)+'</small></div>').join('')
    : '<div class="card">No full 08:00-13:00 forecast for this day.</div>';
  document.getElementById('tbl').innerHTML =
    '<tr><th>Hour</th>'+D.panels.map(p=>'<th>'+p+' (W)</th>').join('')+'<th>Total (W)</th></tr>'+
    d.hours.map(h=>'<tr><td>'+h.hour+'</td>'+D.panels.map(p=>'<td>'+h[p]+'</td>').join('')+
    '<td><b>'+h.total+'</b></td></tr>').join('');
}
sel.onchange=()=>render(sel.value);
render(0);
</script></body></html>
