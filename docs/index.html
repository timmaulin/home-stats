<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar forecast</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
 *{box-sizing:border-box}
 body{font-family:system-ui,sans-serif;width:min(100%,860px);margin:0 auto;padding:clamp(12px,4vw,24px);background:#fafafa;color:#222}
 h1{font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.15}
 select{display:block;width:100%;max-width:360px;min-height:44px;font:inherit;padding:8px 10px;margin:12px 0}
 .cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
 .card{flex:1 1 260px;min-width:0;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}
 .big{font-size:clamp(1.2rem,4vw,1.4rem);font-weight:600}
 .chart-wrap{position:relative;width:100%;height:280px;margin:16px 0}
 small{color:#666}
 .battery-name{display:block;font-size:.95rem;margin-bottom:8px}
 .battery-result{display:block;line-height:1.25}
 .battery-cloudy{display:block;margin-top:8px;font-size:.9rem}
 @media(max-width:480px){body{padding:12px}.card{flex-basis:100%}.chart-wrap{height:300px}}
 @media(min-width:700px){.chart-wrap{height:360px}}
 .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body>
<h1>Solar forecast</h1>
<small id="upd"></small><br>
<label class="sr-only" for="day">Forecast day</label>
<select id="day"></select>
<div class="big" id="tot"></div>
<div class="chart-wrap"><canvas id="chart"></canvas></div>
<h2>Battery (<span id="bat"></span>)</h2>
<div class="cards" id="cards"></div>
<script>
const D = {"updated": "Thu 19 Nov 2026 22:49", "battery_wh": 3000, "window": "08:00-13:00", "panels": ["Wall panel", "Roof panels"], "days": [{"date": "2026-11-20", "label": "Fri 20 Nov", "hours": [{"hour": "07:00", "Wall panel": 0, "Roof panels": 1, "total": 1}, {"hour": "08:00", "Wall panel": 6, "Roof panels": 25, "total": 31}, {"hour": "09:00", "Wall panel": 80, "Roof panels": 177, "total": 257}, {"hour": "10:00", "Wall panel": 193, "Roof panels": 401, "total": 594}, {"hour": "11:00", "Wall panel": 248, "Roof panels": 520, "total": 768}, {"hour": "12:00", "Wall panel": 277, "Roof panels": 577, "total": 854}, {"hour": "13:00", "Wall panel": 277, "Roof panels": 564, "total": 842}, {"hour": "14:00", "Wall panel": 232, "Roof panels": 455, "total": 687}, {"hour": "15:00", "Wall panel": 91, "Roof panels": 170, "total": 261}], "total_kwh": 4.29, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 100}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 54}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": false, "hours": 5, "remaining_pct": 26}, "cloudy": {"empty": true, "hours": 3.1, "empty_at": "11:06"}}]}, {"date": "2026-11-21", "label": "Sat 21 Nov", "hours": [{"hour": "07:00", "Wall panel": 1, "Roof panels": 1, "total": 2}, {"hour": "08:00", "Wall panel": 65, "Roof panels": 98, "total": 163}, {"hour": "09:00", "Wall panel": 160, "Roof panels": 304, "total": 465}, {"hour": "10:00", "Wall panel": 231, "Roof panels": 468, "total": 699}, {"hour": "11:00", "Wall panel": 276, "Roof panels": 573, "total": 849}, {"hour": "12:00", "Wall panel": 301, "Roof panels": 621, "total": 922}, {"hour": "13:00", "Wall panel": 284, "Roof panels": 575, "total": 859}, {"hour": "14:00", "Wall panel": 225, "Roof panels": 440, "total": 665}, {"hour": "15:00", "Wall panel": 83, "Roof panels": 154, "total": 237}], "total_kwh": 4.86, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 100}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 69}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": false, "hours": 5, "remaining_pct": 48}, "cloudy": {"empty": true, "hours": 3.4, "empty_at": "11:23"}}]}, {"date": "2026-11-22", "label": "Sun 22 Nov", "hours": [{"hour": "08:00", "Wall panel": 4, "Roof panels": 19, "total": 23}, {"hour": "09:00", "Wall panel": 9, "Roof panels": 57, "total": 67}, {"hour": "10:00", "Wall panel": 19, "Roof panels": 95, "total": 114}, {"hour": "11:00", "Wall panel": 29, "Roof panels": 119, "total": 148}, {"hour": "12:00", "Wall panel": 33, "Roof panels": 126, "total": 160}, {"hour": "13:00", "Wall panel": 27, "Roof panels": 105, "total": 133}, {"hour": "14:00", "Wall panel": 11, "Roof panels": 52, "total": 62}, {"hour": "15:00", "Wall panel": 2, "Roof panels": 11, "total": 13}], "total_kwh": 0.72, "battery": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 5, "remaining_pct": 63}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 48}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": true, "hours": 3.27, "empty_at": "11:16"}, "cloudy": {"empty": true, "hours": 3.06, "empty_at": "11:03"}}]}]};
const sel = document.getElementById('day');
document.getElementById('upd').textContent = 'Updated ' + D.updated;
document.getElementById('bat').textContent =
  (D.battery_wh/1000) + ' kWh, on at ' + D.window.replace('-', ', off at ');
D.days.forEach((d,i)=>sel.add(new Option(d.label,i)));
let chart;
function fmt(r){
  if(r.empty){
    const h=Math.floor(r.hours), m=Math.round((r.hours-h)*60);
    return 'Empty at '+r.empty_at+' ('+h+'h '+m+'m)';
  }
  return 'Lasts to '+D.window.split('-')[1]+', '+r.remaining_pct+'% left';
}
function render(i){
  const d=D.days[i];
  document.getElementById('tot').textContent = d.total_kwh+' kWh expected';
  const labels=d.hours.map(h=>h.hour);
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('chart'),{type:'bar',
    data:{labels,datasets:D.panels.map((p,i)=>({
      label:p,
      data:d.hours.map(h=>h[p]),
      backgroundColor:i===0?'#c98a45':'#6f91a8',
      borderRadius:4,
      borderSkipped:false,
      maxBarThickness:42
    }))},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,padding:14,font:{size:12}}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toLocaleString()+' W'}}
      },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{font:{size:11},maxRotation:0}},
        y:{stacked:true,beginAtZero:true,grid:{color:'#e5e7eb'},ticks:{font:{size:11},callback:v=>v>=1000?(v/1000)+' kW':v+' W'}}
      }
    }});
  document.getElementById('cards').innerHTML = d.battery ? d.battery.map(b=>
      '<div class="card"><b class="battery-name">'+b.name+' ('+b.load_w+' W)</b>'+
      '<span class="battery-result big">'+fmt(b.expected)+'</span>'+
      '<small class="battery-cloudy">Cloudy case (P10): '+fmt(b.cloudy)+'</small></div>').join('')
    : '<div class="card">No full 08:00-13:00 forecast for this day.</div>';
}
sel.onchange=()=>render(sel.value);
render(0);
</script></body></html>
