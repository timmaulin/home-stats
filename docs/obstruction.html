<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obstruction model comparison</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
 *{box-sizing:border-box}
 body{font-family:system-ui,sans-serif;max-width:860px;margin:0 auto;padding:clamp(12px,4vw,24px);background:#fafafa;color:#222}
 h1{font-size:clamp(1.7rem,6vw,2.2rem)}
 select{display:block;width:100%;max-width:360px;min-height:44px;margin:12px 0;font:inherit;padding:8px 10px}
 .chart-wrap{height:320px}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
 .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:14px}
 .big{display:block;font-size:1.35rem;font-weight:700;margin:6px 0}
 small{color:#666}
 @media(max-width:480px){body{padding:12px}.chart-wrap{height:300px}}
</style></head><body>
<p><a href="index.html">Solar forecast</a></p>
<h1>Obstruction model comparison</h1>
<label for="day">Forecast day</label>
<select id="day"></select>
<div class="chart-wrap"><canvas id="chart"></canvas></div>
<div class="cards" id="cards"></div>
<script>
const D={"updated": "Fri 20 Nov 2026 07:24", "battery_wh": 3000, "window": "08:00-13:00", "panels": ["Wall panel", "Roof panels"], "days": [{"date": "2026-11-20", "label": "Fri 20 Nov", "hours": [{"hour": "07:00", "Wall panel": 0, "Roof panels": 1, "total": 1}, {"hour": "08:00", "Wall panel": 18, "Roof panels": 45, "total": 64}, {"hour": "09:00", "Wall panel": 127, "Roof panels": 252, "total": 379}, {"hour": "10:00", "Wall panel": 226, "Roof panels": 461, "total": 687}, {"hour": "11:00", "Wall panel": 280, "Roof panels": 581, "total": 861}, {"hour": "12:00", "Wall panel": 306, "Roof panels": 630, "total": 936}, {"hour": "13:00", "Wall panel": 297, "Roof panels": 600, "total": 896}, {"hour": "14:00", "Wall panel": 247, "Roof panels": 481, "total": 727}, {"hour": "15:00", "Wall panel": 97, "Roof panels": 180, "total": 278}], "total_kwh": 4.83, "battery": {"scenarios": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 6, "remaining_pct": 91}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 56}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": true, "hours": 3.67, "empty_at": "10:40"}, "cloudy": {"empty": true, "hours": 3.16, "empty_at": "11:09"}}], "heating": {"expected": 2.5, "cloudy": null}, "obstruction": {"start": "07:00", "end": "11:00"}}}, {"date": "2026-11-21", "label": "Sat 21 Nov", "hours": [{"hour": "07:00", "Wall panel": 1, "Roof panels": 1, "total": 2}, {"hour": "08:00", "Wall panel": 62, "Roof panels": 95, "total": 158}, {"hour": "09:00", "Wall panel": 153, "Roof panels": 293, "total": 446}, {"hour": "10:00", "Wall panel": 220, "Roof panels": 448, "total": 667}, {"hour": "11:00", "Wall panel": 264, "Roof panels": 549, "total": 813}, {"hour": "12:00", "Wall panel": 287, "Roof panels": 594, "total": 881}, {"hour": "13:00", "Wall panel": 274, "Roof panels": 557, "total": 831}, {"hour": "14:00", "Wall panel": 224, "Roof panels": 438, "total": 662}, {"hour": "15:00", "Wall panel": 80, "Roof panels": 150, "total": 230}], "total_kwh": 4.69, "battery": {"scenarios": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 6, "remaining_pct": 88}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 67}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": true, "hours": 3.67, "empty_at": "10:40"}, "cloudy": {"empty": true, "hours": 3.34, "empty_at": "11:20"}}], "heating": {"expected": 2.5, "cloudy": null}, "obstruction": {"start": "07:00", "end": "11:00"}}}, {"date": "2026-11-22", "label": "Sun 22 Nov", "hours": [{"hour": "07:00", "Wall panel": 0, "Roof panels": 1, "total": 1}, {"hour": "08:00", "Wall panel": 13, "Roof panels": 35, "total": 48}, {"hour": "09:00", "Wall panel": 47, "Roof panels": 120, "total": 167}, {"hour": "10:00", "Wall panel": 87, "Roof panels": 214, "total": 301}, {"hour": "11:00", "Wall panel": 102, "Roof panels": 253, "total": 355}, {"hour": "12:00", "Wall panel": 72, "Roof panels": 200, "total": 272}, {"hour": "13:00", "Wall panel": 32, "Roof panels": 114, "total": 146}, {"hour": "14:00", "Wall panel": 11, "Roof panels": 56, "total": 67}, {"hour": "15:00", "Wall panel": 2, "Roof panels": 12, "total": 14}], "total_kwh": 1.37, "battery": {"scenarios": [{"name": "Baseload only", "load_w": 300, "expected": {"empty": false, "hours": 6, "remaining_pct": 56}, "cloudy": {"empty": false, "hours": 5, "remaining_pct": 51}}, {"name": "Heat pump running", "load_w": 900, "expected": {"empty": true, "hours": 3.67, "empty_at": "10:40"}, "cloudy": {"empty": true, "hours": 3.1, "empty_at": "11:06"}}], "heating": {"expected": 2.5, "cloudy": null}, "obstruction": {"start": "07:00", "end": "11:00"}}}]};
const sel=document.getElementById('day');
D.days.forEach((d,i)=>sel.add(new Option(d.label,i)));
let chart;
function render(i){
  const d=D.days[i];
  const obstruction=d.battery&&d.battery.obstruction;
  const start=obstruction?obstruction.start:'07:00';
  const end=obstruction?obstruction.end:'11:00';
  const raw=d.hours.map(h=>h.total);
  const fixed=d.hours.map(h=>h.hour>=start&&h.hour<end?0:h.total);
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('chart'),{type:'line',
    data:{labels:d.hours.map(h=>h.hour),datasets:[
      {label:'Solcast no obstruction',data:raw,borderColor:'#6f91a8',backgroundColor:'#6f91a822',fill:false,tension:.2},
      {label:'Fixed obstruction '+start+'-'+end,data:fixed,borderColor:'#c98a45',backgroundColor:'#c98a4522',fill:false,tension:.2}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+' W'}}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:'Watts'}}}}
  });
  const rawKwh=raw.reduce((sum,v)=>sum+v,0)/1000;
  const fixedKwh=fixed.reduce((sum,v)=>sum+v,0)/1000;
  document.getElementById('cards').innerHTML=
    '<div class="card"><b>No obstruction</b><span class="big">'+rawKwh.toFixed(2)+' kWh</span><small>Solcast forecast</small></div>'+
    '<div class="card"><b>Fixed 4-hour model</b><span class="big">'+fixedKwh.toFixed(2)+' kWh</span><small>'+start+'-'+end+' excluded</small></div>'+
    '<div class="card"><b>Battery heating</b><span class="big">'+(d.battery.heating?.expected??0)+' hours</span><small>Expected no-depletion result</small></div>';
}
sel.onchange=()=>render(sel.value);
render(0);
</script></body></html>
